<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box-Model</title>

    <style>

        .eg1 {
            width: 220px;
            background-color: lightgreen;
            padding: 0px;
            border: 0px;
            margin: 0px;
        }

        .eg2 {
            width: 220px;
            background-color: lightcoral;
            padding: 50px;
            border: 5px solid black;
            margin: 40px 20px;

        }

        .line1 {
            width: 10%;
            height: 10px;
            color: brown;
            background-color: black;
            
        }

        .line2 {
            width: 20%;
            height: 1px;
            color: navy;
            background-color: black;
            
        }
    </style>
</head>
<body>

    <h1>This is about CSS Box-Model</h1>

    <hr>

    <p class="eg1">This is My first para content</p>

    <hr class="line1">

    <p class="eg2">This is My second para content</p>

    <hr class="line2">
    
</body>
</html>
